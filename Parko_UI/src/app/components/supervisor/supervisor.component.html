<div class="app-container">

  <!-- ================= APP TOP BAR ================= -->
  <div class="app-top-bar">
    <!-- LEFT -->
    <div class="app-left">
      <img src="assets/images/logo.png" class="app-icon" />
      <span class="app-name">Parko</span>
    </div>

    <!-- CENTER -->
    <div class="app-center">
      <span class="page-title">Supervisor Dashboard</span>
    </div>

    <!-- RIGHT -->
    <div class="app-right">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <!-- ================= DASHBOARD ================= -->
  <div class="dashboard-wrapper">

    <!-- DASHBOARD FILTER BAR -->
    <div class="top-bar">
      <!-- LEFT -->
      <div class="top-left">
        <div class="filters">
          <label>Period</label>
          <select [(ngModel)]="period">
            <option value="date">Date</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
            <option value="year">Year</option>
          </select>

          <label>Zone</label>
          <select [(ngModel)]="zoneFilter">
            <option value="">All Zones</option>
            <option *ngFor="let z of zones" [value]="z">{{ z }}</option>
          </select>

          <button class="apply" (click)="apply()">Apply</button>
          <button class="refresh" (click)="refresh()">Refresh</button>
        </div>
      </div>

      <!-- CENTER -->
      <div class="top-center">
        <h1>Quick Info</h1>
        <div class="quick-info">
          Filters: {{ period | uppercase }} • {{ refDateStr }}
        </div>
      </div>

      <!-- RIGHT -->
      <div class="top-right status-box">
        <div><span class="lab" style="font-size: large;">Last update:</span> {{ lastUpdate | date }}</div>
        <div><span class="lab" style="font-size: large;">Timezone:</span> {{ timezone }}</div>
      </div>
    </div>

    <!-- ================= MAIN GRID ================= -->
    <div class="content-area">

      <div class="left-panel">
        <div class="income-card">
          <h3>Income</h3>
          <div class="chart-box">
            <canvas #chartCanvas></canvas>
          </div>
        </div>

        <div class="vehicle-chart-wrapper">
          <h3>Vehicle count</h3>
        <canvas #vehicleChart></canvas>
        </div>

      </div>

      <div class="records-panel">
        <h3>Live Records</h3>

        <div class="records-search">
          <input class="bar1" placeholder="Search" [(ngModel)]="searchTerm">
          <select class="bar2" [(ngModel)]="searchField">
            <option value="all">All</option>
            <option value="vehicleNumber">Vehicle</option>
            <option value="ownerName">Owner</option>
            <option value="slotId">Slot</option>
          </select>
          <button class="bar-" (click)="exportToExcel()">Export</button>
          <button class="bar" (click)="searchTerm=''">Clear</button>
        </div>

        <div class="table-box">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th *ngFor="let col of tableColumns">
                  {{ humanize(col) }}
                </th>
              </tr>
            </thead>
            <tbody>
            <tr *ngFor="let r of filteredRows; let i = index">

            <td>{{ i + 1 }}</td>

            <td *ngFor="let col of tableColumns">

            <ng-container *ngIf="col === 'vehicleImagePath'; else normalCell">
        <button
          class="view-image-btn"
          *ngIf="r[col]"
          (click)="openImage(r[col])">
          View Image
        </button>
        <span *ngIf="!r[col]" class="no-image">—</span>
      </ng-container>

      <!-- NORMAL CELL -->
      <ng-template #normalCell>
        {{ formatCell(r[col], col) }}
      </ng-template>

    </td>
  </tr>
</tbody>

          </table>
        </div>
      </div>

    </div>
  </div>
</div>
<!-- ================= IMAGE PREVIEW MODAL ================= -->
<div class="image-modal" *ngIf="previewImageUrl" (click)="closeImage()">
  <div class="image-modal-content" (click)="$event.stopPropagation()">
    <img [src]="previewImageUrl" />
    <button class="close-btn" (click)="closeImage()">✕</button>
  </div>
</div>
