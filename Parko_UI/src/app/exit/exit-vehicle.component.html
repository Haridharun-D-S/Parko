        <header class="app-header">
  <!-- LEFT: LOGO + APP NAME -->
  <div class="header-left">
    <img src="assets/images/logo.png" alt="App Logo" class="app-logo" />
    <!-- <span class="app-name">Parko</span> -->
  </div>

  <!-- CENTER: PAGE NAME -->
  <div class="header-center">
    Attendant Dashboard
  </div>

  <!-- RIGHT: USER + LOGOUT -->
  <div class="header-right">
    <span class="user-name">👤 Attendant</span>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</header>
<div class="container">

  <h2>Vehicle Exit</h2>

  <form class="form-box" (ngSubmit)="exitVehicle()" novalidate>
    <label for="exitVehicle">Vehicle Number</label>
    <input
      id="exitVehicle"
      name="exitVehicleNumber"
      type="text"
      placeholder="TN 10 AB 1234"
      [(ngModel)]="exitVehicleNumber"
      (input)="onVehicleInput($event)"
      (paste)="onVehiclePaste($event)"
      maxlength="13"
      autocomplete="off"
      required
      class="vehicle-input"
    />

    <label for="exitOwner">Owner Name</label>
    <input
      id="exitOwner"
      name="exitOwnerName"
      type="text"
      [(ngModel)]="exitOwnerName"
      (blur)="ownerTouched = true"
      required
    />
    <div class="ml-box">
            <!-- <img *ngIf="capturedImage" [src]="capturedImage" class="preview"/> -->

  <button type="button" (click)="openCamera()">📷 Capture Plate</button>

  <!-- Upload button -->
  <button type="button" (click)="fileInput.click()">📁 Upload Image</button>

  <input
    #fileInput
    type="file"
    accept="image/*"
    hidden
    (change)="onFileSelected($event)"
  />

  <video
    #video
    *ngIf="cameraOpen"
    autoplay
    playsinline>
  </video>

  <canvas #canvas hidden></canvas>

  
</div>
<button type="button" (click)="runOCR()" [disabled]="!capturedImage">
    🤖 Detect Plate
  </button>
    <button type="submit" class="exit-btn" (click)="vehicleTouched = true; ownerTouched = true;"  [disabled]="!exitVehicleNumber || !exitOwnerName.trim()">
      Exit Vehicle
    </button>
    <!-- CAMERA / ML -->
    <!-- CAMERA / ML -->




  </form>

  <!-- Message pill (visible and accessible) -->
  <div *ngIf="message" class="msg" [class.ok]="billAmount !== null" [class.err]="billAmount === null" role="status" aria-live="polite">
    {{ message }}
  </div>

  <!-- Bill Section -->
  <div class="bill-box" *ngIf="billAmount !== null">
    <button class="preview-btn" (click)="previewReceipt()">
      Print/Preview
    </button>
    
  </div>

  <button class="attendant-back" (click)="goBack()">Back</button>
</div>
